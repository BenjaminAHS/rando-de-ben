title: "Mes randonnées"
description: "Carnet de randos (distance, D+, difficulté, cartes GPX)"
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Affiche les tags
collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: rando
      permalink: /randos/:title/
